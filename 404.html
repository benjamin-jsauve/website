<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benjamin — 404</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050507" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23050507'/%3E%3Ccircle cx='32' cy='32' r='17' fill='%23000' stroke='%23ffd9b0' stroke-width='3'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" />
  <!-- Self-contained on purpose: GitHub Pages serves this file at whatever path was missing,
       so relative asset links would break on nested URLs. -->
  <style>
    :root { --bg: #050507; --ink: #f1efe9; --ink-2: #b8b6af; --ink-3: #7a7872; --hot: #ffb27a; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body {
      display: grid; place-items: center; padding: 24px;
      color: var(--ink-2); font: 400 17px/1.7 "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .wrap { position: relative; max-width: 640px; text-align: center; }
    .ev { font: 400 11.5px/1.5 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 22px; }
    .ev b { font-weight: 400; color: var(--hot); }
    h1 { margin: 0 0 22px; font: 400 clamp(96px, 22vw, 220px)/.85 "Instrument Serif", serif; letter-spacing: -.03em; color: var(--ink); }
    h1 em { color: var(--hot); }
    blockquote { margin: 0 auto 10px; max-width: 30em; font: italic 400 clamp(22px, 3vw, 30px)/1.3 "Instrument Serif", serif; color: var(--ink); }
    cite { display: block; margin-bottom: 36px; font: 400 11px/1.5 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; font-style: normal; color: var(--ink-3); }
    a { color: var(--ink); font: 400 12px/1 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid rgba(241,239,233,.3); padding-bottom: 4px; }
    a:hover { color: var(--hot); border-color: var(--hot); }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="wrap">
    <p class="ev"><b>Event ∞</b> &nbsp;·&nbsp; outside the light cone</p>
    <h1>4<em>0</em>4</h1>
    <blockquote>Whereof one cannot speak, thereof one must be silent.</blockquote>
    <cite>Wittgenstein, Tractatus 7</cite>
    <a id="home" href="./">Return to origin ⟶</a>
  </div>
  <script>
    (function () {
      // GitHub project pages live under /<repo>/; send people back to the site root either way.
      var seg = location.pathname.split('/').filter(Boolean);
      var base = location.hostname.endsWith('github.io') && seg.length ? '/' + seg[0] + '/' : '/';
      document.getElementById('home').setAttribute('href', base);

      // a small, static field of stars falling into the missing page
      var c = document.getElementById('c'), x = c.getContext('2d'), stars = [], W, H, k;
      function size() {
        k = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
        c.width = W * k; c.height = H * k; x.setTransform(k, 0, 0, k, 0, 0);
      }
      size(); addEventListener('resize', size);
      for (var i = 0; i < 260; i++) stars.push({ a: Math.random() * 6.283, r: Math.random(), s: Math.random() });
      var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      function draw(t) {
        x.clearRect(0, 0, W, H);
        var cx = W / 2, cy = H / 2, R = Math.hypot(W, H) / 2;
        for (var i = 0; i < stars.length; i++) {
          var st = stars[i];
          if (!still) { st.r -= 0.0009 * (0.3 + st.s) / (st.r + 0.15); st.a += 0.004 / (st.r + 0.05); }
          if (st.r < 0.02) { st.r = 1; st.a = Math.random() * 6.283; }
          var rr = st.r * R, px = cx + Math.cos(st.a) * rr, py = cy + Math.sin(st.a) * rr;
          var fade = Math.min(1, st.r * 3);
          x.fillStyle = 'rgba(' + (st.r < 0.25 ? '255,170,120' : '220,228,255') + ',' + (0.25 + 0.55 * st.s) * fade + ')';
          x.fillRect(px, py, 1.2, 1.2);
        }
        if (!still) requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
