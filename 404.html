<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='18' cy='20' r='12.5' fill='%23e63946'/%3E%3Ccircle cx='46' cy='20' r='12.5' fill='%2322a060'/%3E%3Ccircle cx='32' cy='44' r='12.5' fill='%232563eb'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
  <!-- Self-contained on purpose: GitHub Pages serves this file at whatever path was missing,
       so relative asset links would break on nested URLs. -->
  <style>
    :root { --ink: #111; --ink-2: #4b4b4b; --ink-3: #8a8a8a; --line: #e8e8e8; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body {
      display: grid; place-items: center; min-height: 100vh; padding: 24px 16px;
      color: var(--ink-2); font: 400 14px/1.7 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 560px; text-align: center; }
    .dots { display: inline-flex; gap: 6px; margin: 0 0 28px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; background: #e63946; }
    .dots i:nth-child(2) { background: #22a060; }
    .dots i:nth-child(3) { background: #2563eb; }
    h1 { margin: 0 0 14px; color: var(--ink); font-size: clamp(72px, 18vw, 140px); font-weight: 500; line-height: 1; letter-spacing: -.06em; }
    .msg { margin: 0 0 36px; }
    blockquote { margin: 0 0 6px; padding-top: 28px; border-top: 1px solid var(--line); color: var(--ink); }
    cite { display: block; margin-bottom: 36px; font-size: 11px; font-style: normal; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
    a { color: var(--ink); text-decoration: none; background: linear-gradient(currentColor, currentColor) 0 100% / 100% 1px no-repeat; }
    a:hover { color: #2563eb; }
    :focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="dots" aria-hidden="true"><i></i><i></i><i></i></p>
    <h1>404</h1>
    <p class="msg">This page was cut into pieces and never reassembled.</p>
    <blockquote>Whereof one cannot speak, thereof one must be silent.</blockquote>
    <cite>Wittgenstein, Tractatus 7</cite>
    <a id="home" href="./">← back to the site</a>
  </main>
  <script>
    // GitHub project pages live under /<repo>/; send people back to the site root either way.
    (function () {
      var seg = location.pathname.split('/').filter(Boolean);
      var base = location.hostname.endsWith('github.io') && seg.length ? '/' + seg[0] + '/' : '/';
      document.getElementById('home').setAttribute('href', base);
    })();
  </script>
</body>
</html>
